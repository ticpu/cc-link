[package]
name = "cc-link"
version = "0.1.0"
edition = "2021"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
description = "Bridge Claude Code cross-session messaging between two machines over SSH"
license = "GPL-3.0-only"
repository = "https://github.com/ticpu/cc-link"
readme = "README.md"
keywords = ["claude-code", "ssh", "relay", "mcp"]
categories = ["command-line-utilities"]

[[bin]]
name = "cc-link"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
nix = { version = "0.31", features = ["hostname", "process", "signal", "socket", "user"] }
notify = "8"
rand = "0.9"
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-journald = "0.3"
uuid = { version = "1", features = ["v5"] }
yamux = "0.14"

[dev-dependencies]
tempfile = "3"
